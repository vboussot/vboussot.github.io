<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VB monogram">
  <style>
    :root { --bg: #3a5bd9; --fg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #7e9bff; --fg: #0e1117; }
    }
  </style>
  <rect width="32" height="32" rx="7" fill="var(--bg)"/>
  <text x="16" y="16" fill="var(--fg)"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="15" font-weight="700" letter-spacing="-0.5"
        text-anchor="middle" dominant-baseline="central">VB</text>
</svg>
